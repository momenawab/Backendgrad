# nginx for SafeSight — serves the React admin panel (static SPA) at / and
# routes the Django API/admin/websockets to the ASGI app (daphne on :8001).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/safesight
#   sudo ln -sf /etc/nginx/sites-available/safesight /etc/nginx/sites-enabled/safesight
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The React production build must be uploaded to /var/www/safesight (see deploy notes).

upstream safesight_app {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name _;                      # EC2 public DNS / IP / domain

    client_max_body_size 25M;           # allow image/video uploads for detection

    # ---- React admin panel (static SPA) ----
    root /var/www/safesight;            # contents of the CRA `build/` folder
    index index.html;

    # ---- Django side ----
    # Django's collected static (admin, DRF) lives under /django-static/ so it
    # doesn't collide with the React build's own /static/ bundles.
    location /django-static/ {
        alias /home/ubuntu/safesight-backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # User-uploaded media (worker photos, detection/violation frames).
    location /media/ {
        alias /home/ubuntu/safesight-backend/media/;
        access_log off;
    }

    # REST API -> ASGI app.
    location /api/ {
        proxy_pass http://safesight_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin -> ASGI app.
    location /admin/ {
        proxy_pass http://safesight_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoints (Django Channels) — needs the Upgrade headers.
    location /ws/ {
        proxy_pass http://safesight_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;       # keep long-lived sockets open
    }

    # React SPA — everything else, including its /static/ bundles. Unknown
    # client-side routes fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
