# nginx reverse proxy for SafeSight.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/safesight
#          sudo ln -s /etc/nginx/sites-available/safesight /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your domain or EC2 public DNS.
# For HTTPS, run: sudo certbot --nginx -d your.domain.com

upstream safesight_app {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name _;                      # e.g. api.example.com or the EC2 public DNS

    client_max_body_size 25M;           # allow image/video uploads for detection

    # Static files collected by `collectstatic`.
    location /static/ {
        alias /home/ubuntu/safesight-backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # User-uploaded media (worker photos, detection frames).
    location /media/ {
        alias /home/ubuntu/safesight-backend/media/;
        access_log off;
    }

    # WebSocket endpoints (Django Channels) — needs the Upgrade headers.
    location /ws/ {
        proxy_pass http://safesight_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;       # keep long-lived sockets open
    }

    # Everything else -> the ASGI app.
    location / {
        proxy_pass http://safesight_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
